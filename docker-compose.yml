services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-backend:latest
    container_name: portfolio-backend
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=production
      - APP_PORT=:8080
      - TNS_ADMIN=/app/wallet
      - OCI_PRIVATE_KEY_PATH=/app/oci_api_key.pem
    volumes:
      - ./wallet:/app/wallet:ro
      - ./oci_api_key.pem:/app/oci_api_key.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Dynamic Application Security Testing (DAST) runner via OWASP ZAP
  # Run via: docker compose --profile dast run zap-dast
  zap-dast:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: portfolio-zap-dast
    profiles:
      - dast
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./docs:/zap/wrk/:rw
    command: zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi -u http://backend:8080 -r dast-report.html
