services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=portfolio
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=portfolio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  oracle-db:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: portfolio-oracle-db
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=devpassword
    volumes:
      - ./docker/init-oracle.sql:/container-entrypoint-initdb.d/init.sql:ro
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-backend:latest
    container_name: portfolio-backend
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=production
      - APP_PORT=:8080
      - DB_DRIVER=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=portfolio
      - DB_PASSWORD=devpassword
      - DB_NAME=portfolio
      - DB_SSLMODE=disable
      - STORAGE_DRIVER=local
      - STORAGE_LOCAL_DIR=/app/uploads
      - STORAGE_BASE_URL=http://localhost:8080/uploads
      - JWT_SECRET=dev-secret-change-me
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD_HASH=$$2a$$10$$Qwz/cxG0s36.a/3nwRf7kuvYI9/V.5ab0Y8C6LNE723211RNOsbdO
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Dynamic Application Security Testing (DAST) runner via OWASP ZAP
  # Run via: docker compose --profile dast run zap-dast
  zap-dast:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: portfolio-zap-dast
    profiles:
      - dast
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./docs:/zap/wrk/:rw
      - ./.zap:/zap/config/:ro
    command: zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi -u http://backend:8080 -r dast-report.html -c /zap/config/rules.tsv

volumes:
  postgres-data:
  oracle-data:
