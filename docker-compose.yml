services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: portfolio-oracle-db
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=devpassword
    volumes:
      - ./docker/init-oracle.sql:/container-entrypoint-initdb.d/init.sql:ro
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-backend:latest
    container_name: portfolio-backend
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=production
      - APP_PORT=:8080
      - ATP_DSN=portfolio_atp/devpassword@oracle-db:1521/FREEPDB1
      - ADW_DSN=portfolio_adw/devpassword@oracle-db:1521/FREEPDB1
      - STORAGE_DRIVER=local
      - STORAGE_LOCAL_DIR=/app/uploads
      - STORAGE_BASE_URL=http://localhost:8080/uploads
      - JWT_SECRET=dev-secret-change-me
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD_HASH=$$2a$$10$$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      oracle-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Dynamic Application Security Testing (DAST) runner via OWASP ZAP
  # Run via: docker compose --profile dast run zap-dast
  zap-dast:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: portfolio-zap-dast
    profiles:
      - dast
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./docs:/zap/wrk/:rw
    command: zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi -u http://backend:8080 -r dast-report.html

volumes:
  oracle-data:
