title = "Walfa Labs Portfolio Backend Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for dummy values, test hashes, and documentation examples"
paths = [
  '''^\.env\.example$''',
  '''^docs/.*''',
  '''^\.github/workflows/.*''',
  '''^migrations/seed.*\.sql$''',
  '''_test\.go$'''
]
regexes = [
  '''\$2a\$10\$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy''', # Demo bcrypt hash
  '''dev-secret-change-me''',
  '''change-me''',
  '''portfolio/change-me@portfolio_atp_high''',
  '''portfolio/change-me@portfolio_adw_high''',
  '''ocid1\.tenancy\.oc1\.\.change-me''',
  '''ocid1\.user\.oc1\.\.change-me''',
  '''dast-test-secret-key-1234567890'''
]
stopwords = [
  "dev-secret-change-me",
  "change-me",
  "dast-test-secret-key-1234567890"
]

