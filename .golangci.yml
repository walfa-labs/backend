version: "2"

run:
  timeout: 5m
  tests: true
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive
    - misspell
    - goconst
    - prealloc
    - unconvert
    - bodyclose
    - gocritic
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback
    govet:
      disable:
        - fieldalignment
        - shadow
    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G101
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-naming
        - name: error-strings
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
    goconst:
      min-len: 3
      min-occurrences: 4
    misspell:
      locale: US
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - whyNoLint
        - unnamedResult
        - hugeParam
        - rangeValCopy
        - httpNoBody
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - goconst
          - prealloc
          - gocritic
      - path: _test\.go
        text: "SA5012:"
        linters:
          - staticcheck
      - path: internal/adapter/repository/
        linters:
          - unconvert

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
